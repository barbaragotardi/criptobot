assets:
  - BTC
  - ETH
  - XRP
  - SOL
  - LINK
  - XLM
  - BCH
  - NEAR
  - UNI
  - LTC
  - AVAX
  - AAVE
  - QNT
  - ATOM
  - ADA
  - HBAR
  - DOT
  - ETC
  - POL
  - ALGO
  - ARB
  - TIA
  - XTZ
  - IMX
  - GRT
  - OP
  - LDO

timeframes:
  macro: 1D
  setup: 4H
  confirmation: 15m

timeframe_map:
  1D: 1d
  4H: 4h
  15m: 15m

data:
  daily_initial_candles: 700
  warmup:
    1D: 700
    4H: 700
    15m: 700

backtest:
  fee_percent: 0.1
  slippage_percent: 0.05

ema:
  periods:
    - 20
    - 50
    - 100
    - 200

atr:
  period: 14

macro:
  price_above_ema200: true
  ema200_slope_required: true
  slope_periods: 5
  ema20_above_ema50: true

market_filter:
  enabled: true
  reference_asset: BTC
  bearish_action: BLOCK
  cache_per_cycle: true

entry:
  allowed_emas:
    - 20
    - 50
  touch_threshold_percent: 1.0
  use_atr_distance: true
  atr_k: 0.5

confirmation:
  timeframe: 15m
  candle_closed_only: true
  require_reversal: true
  method: reversal  # reversal | ema_reclaim

invalidation:
  max_15m_candles_without_confirmation: 16
  invalidate_below_pullback_low: true
  invalidate_below_ema50_4h: true

risk:
  stop_method: structure_atr  # structure_atr | atr_only
  atr_multiplier: 1.0
  min_risk_reward: 2.0
  max_risk_per_trade_percent: 1.0
  simulated_account_balance: 1000

target:
  absolute_min_percent: 3.0
  preferred_min_percent: 5.0
  preferred_max_percent: 10.0
  max_tp_percent: 50.0
  allow_above_preferred_range: true
  resistance_aware: true
  resistance_lookback_4h: 50

exposure:
  max_open_signals: 15
  max_signals_per_day: 10
  max_correlated_exposure: 15

paper_trading:
  enabled: true

portfolio:
  enabled: true
  thresholds_percent: [5.0, 10.0]

supports:
  sma_short: 30
  sma_long: 200
  discovery_lookback: 90
  fib_ratios: [0.382, 0.5, 0.618, 0.786]
  fractal_k: 2
  min_swing_move_percent: 10.0
  use_wicks: true

ai:
  enabled: true
  model: "anthropic/claude-haiku-4-5-20251001"
  timeout_s: 40
  max_tokens: 800
  temperature: 0.0
  max_calls_per_day: 50
  command_cooldown_s: 60
  embedding_model: "gemini-embedding-2"
  embedding_dim: 768
  rag:
    enabled: true
    news_max_age_hours: 48
    max_headlines: 12
    min_similarity: 0.30
    near_dup_similarity: 0.92
    retention_days: 365
    ingest_interval_min: 60
    max_days_dossier: 30
  asset_aliases:
    BTC: ["Bitcoin", "BTC"]
    ETH: ["Ethereum", "ETH"]
    XRP: ["Ripple", "XRP"]
    SOL: ["Solana", "SOL"]
    LINK: ["Chainlink", "LINK"]
    ADA: ["Cardano", "ADA"]
    DOT: ["Polkadot", "DOT"]
    BNB: ["Binance", "BNB"]
    DOGE: ["Dogecoin", "DOGE"]

system:
  candle_closed_only: true
  cooldown_hours: 12
  poll_seconds: 60
  telegram_poll_timeout_s: 30
  timezone: America/Sao_Paulo
  quote_currency: USDT
  database_url: ""  # prod via $DATABASE_URL (compose); vazio = erro (sem fallback)
  dry_run: false
