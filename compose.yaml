services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-robit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-robit}
      POSTGRES_DB: ${POSTGRES_DB:-robit}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-robit}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-robit}:${POSTGRES_PASSWORD:-robit}@db:5432/${POSTGRES_DB:-robit}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # config em volume para ajustar sem rebuild
      - ./config:/app/config:ro

volumes:
  pgdata:
