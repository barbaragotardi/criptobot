services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
      POSTGRES_USER: ${POSTGRES_USER:-robit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-robit}
      POSTGRES_DB: ${POSTGRES_DB:-robit}
    # Override postgresql.conf herdado do pgdata (initdb antigo em UTC).
    command: ["postgres", "-c", "timezone=America/Sao_Paulo", "-c", "log_timezone=America/Sao_Paulo"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-robit}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env
    environment:
      TZ: America/Sao_Paulo
      DATABASE_URL: postgresql://${POSTGRES_USER:-robit}:${POSTGRES_PASSWORD:-robit}@db:5432/${POSTGRES_DB:-robit}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # config em volume para ajustar sem rebuild
      - ./config:/app/config:ro

volumes:
  pgdata:
